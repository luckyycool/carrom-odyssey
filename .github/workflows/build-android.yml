name: Build Android App Bundle (AAB) & Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Manual Version Code (optional, leave empty for auto-increment)'
        required: false
        type: string
      version_name:
        description: 'Manual Version Name (optional, e.g. 1.0.1, leave empty for auto-increment)'
        required: false
        type: string
      deploy_to_playstore:
        description: 'Deploy to Google Play Store'
        required: true
        default: true
        type: boolean
      playstore_track:
        description: 'Google Play Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      playstore_status:
        description: 'Google Play Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
      changes_not_sent_for_review:
        description: 'Changes Not Sent For Review (true for draft/rejected/manual console review)'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Calculate Version Code and Version Name
        id: versioning
        run: |
          BASE_VERSION_CODE=1
          CALCULATED_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))

          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            FINAL_CODE="${{ github.event.inputs.version_code }}"
          else
            FINAL_CODE=$CALCULATED_CODE
          fi

          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            FINAL_NAME="${{ github.event.inputs.version_name }}"
          else
            FINAL_NAME="1.0.$((0 + GITHUB_RUN_NUMBER))"
          fi

          echo "VERSION_CODE=$FINAL_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$FINAL_NAME" >> $GITHUB_ENV
          echo "Building with VERSION_CODE=$FINAL_CODE and VERSION_NAME=$FINAL_NAME"

      - name: Inject Production AdMob Configuration
        run: |
          echo "VITE_ENABLE_ADMOB=true" > .env.production
          echo "VITE_ADMOB_APP_ID=ca-app-pub-0897820292119776~2022691273" >> .env.production
          echo "VITE_ADMOB_REWARDED_ID=ca-app-pub-0897820292119776/5556797516" >> .env.production
          echo "VITE_ADMOB_IS_TESTING=false" >> .env.production

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Accept Android SDK Licenses & Ensure API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode Keystore
        id: keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | tr -d '\r\n ' | base64 -d > "${{ github.workspace }}/release-key.jks" 2>/dev/null || echo "$ENCODED_KEYSTORE" | tr -d '\r\n ' | base64 --decode > "${{ github.workspace }}/release-key.jks"
            if [ -s "${{ github.workspace }}/release-key.jks" ]; then
              echo "KEYSTORE_PATH=${{ github.workspace }}/release-key.jks" >> $GITHUB_ENV
              echo "Keystore decoded successfully. Size: $(wc -c < "${{ github.workspace }}/release-key.jks") bytes."
            else
              echo "::warning::Keystore could not be decoded or is empty; building unsigned."
            fi
          else
            echo "::warning::Secret KEYSTORE_BASE64 is empty or not configured; building unsigned."
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (Release AAB)
        working-directory: android
        env:
          RAW_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEY_PASS }}
        run: |
          STORE_PASS=$(echo -n "$RAW_STORE_PASSWORD" | tr -d '\r\n')
          KEY_AL=$(echo -n "$RAW_KEY_ALIAS" | tr -d '\r\n ')
          KEY_PASS=$(echo -n "$RAW_KEY_PASSWORD" | tr -d '\r\n')

          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$STORE_PASS"
          fi

          export KEYSTORE_PATH="${{ env.KEYSTORE_PATH }}"
          export STORE_PASSWORD="$STORE_PASS"
          export KEY_ALIAS="$KEY_AL"
          export KEY_PASSWORD="$KEY_PASS"
          export VERSION_CODE="${{ env.VERSION_CODE }}"
          export VERSION_NAME="${{ env.VERSION_NAME }}"

          echo "Starting bundleRelease (key alias: $KEY_AL, version: $VERSION_NAME, code: $VERSION_CODE)..."

          ./gradlew :app:bundleRelease \
            --parallel \
            --build-cache \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x lint \
            -PVERSION_CODE="${{ env.VERSION_CODE }}" \
            -PVERSION_NAME="${{ env.VERSION_NAME }}" \
            -PKEYSTORE_PATH="${{ env.KEYSTORE_PATH }}" \
            -PSTORE_PASSWORD="$STORE_PASS" \
            -PKEY_ALIAS="$KEY_AL" \
            -PKEY_PASSWORD="$KEY_PASS"

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carrom-odyssey-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 1 # Automatically deletes after 24 hours to respect storage limits
          if-no-files-found: warn

      - name: Prepare Google Play Service Account JSON
        if: ${{ github.event.inputs.deploy_to_playstore != 'false' }}
        env:
          PLAYSTORE_JSON_1: ${{ secrets.PLAYSTORE_ACCOUNT_JSON }}
          PLAYSTORE_JSON_2: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          PLAYSTORE_JSON_3: ${{ secrets.PLAY_CONFIG_JSON || secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAYSTORE_JSON_1" ]; then
            echo "$PLAYSTORE_JSON_1" > service-account.json
            echo "HAVE_PLAYSTORE_JSON=true" >> $GITHUB_ENV
            echo "Service account JSON loaded from PLAYSTORE_ACCOUNT_JSON."
          elif [ -n "$PLAYSTORE_JSON_2" ]; then
            echo "$PLAYSTORE_JSON_2" > service-account.json
            echo "HAVE_PLAYSTORE_JSON=true" >> $GITHUB_ENV
            echo "Service account JSON loaded from PLAYSTORE_SERVICE_ACCOUNT_JSON."
          elif [ -n "$PLAYSTORE_JSON_3" ]; then
            echo "$PLAYSTORE_JSON_3" > service-account.json
            echo "HAVE_PLAYSTORE_JSON=true" >> $GITHUB_ENV
            echo "Service account JSON loaded from PLAY_CONFIG_JSON / PLAY_STORE_JSON_KEY."
          else
            echo "::warning::No Play Store service account JSON secret found. Skipping Play Store upload."
            echo "HAVE_PLAYSTORE_JSON=false" >> $GITHUB_ENV
          fi

          if [ -f service-account.json ]; then
            if jq empty service-account.json 2>/dev/null; then
              echo "Service account JSON verified as valid JSON format."
            else
              echo "::error::Service account JSON secret is malformed or invalid JSON syntax."
              exit 1
            fi
          fi

      - name: Check Deobfuscation Mapping
        run: |
          if [ -f "android/app/build/outputs/mapping/release/mapping.txt" ]; then
            echo "MAPPING_FILE=android/app/build/outputs/mapping/release/mapping.txt" >> $GITHUB_ENV
            echo "Found mapping file: android/app/build/outputs/mapping/release/mapping.txt"
          else
            echo "MAPPING_FILE=" >> $GITHUB_ENV
            echo "No mapping file found; skipping mapping upload."
          fi

      - name: Deploy AAB to Google Play Store
        id: deploy_playstore
        if: ${{ (github.event.inputs.deploy_to_playstore != 'false') && (env.HAVE_PLAYSTORE_JSON == 'true') }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.games.carromodyssey
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          mappingFile: ${{ env.MAPPING_FILE }}
          track: ${{ github.event.inputs.playstore_track || 'internal' }}
          status: ${{ github.event.inputs.playstore_status || 'completed' }}

      - name: Retry Deploy with changesNotSentForReview=true (Smart Fallback)
        if: ${{ steps.deploy_playstore.outcome == 'failure' && (github.event.inputs.deploy_to_playstore != 'false') && (env.HAVE_PLAYSTORE_JSON == 'true') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.games.carromodyssey
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          mappingFile: ${{ env.MAPPING_FILE }}
          track: ${{ github.event.inputs.playstore_track || 'internal' }}
          status: ${{ github.event.inputs.playstore_status || 'completed' }}
          changesNotSentForReview: true
